name: "CodeQL Advanced"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "33 3 * * 4"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Explicit least-privilege permissions.
    permissions:
      # Required to upload CodeQL SARIF results
      security-events: write

      # Required for private/internal CodeQL packs
      packages: read

      # Required by CodeQL for workflow information
      actions: read

      # Required to checkout/read the repository
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Scan GitHub Actions workflow files
          - language: actions
            build-mode: none

          # Scan the Node.js / JavaScript / TypeScript application
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
          wait-for-processing: true
