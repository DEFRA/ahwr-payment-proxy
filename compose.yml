services:
  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - '4570:4566' # LocalStack Gateway
      - '4910-4959:4910-4959' # external services port range
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3,sqs,sns,firehose
      LOCALSTACK_HOST: 127.0.0.1
      EXTERNAL_SERVICE_PORTS_START: 4910
      EXTERNAL_SERVICE_PORTS_END: 4959
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', '-f', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - ahwr-local

  mongodb:
    image: mongo:7.0.28
    networks:
      - ahwr-local
    ports:
      - '27022:27017'
    volumes:
      - mongodb-data:/data
      - ./compose/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      start_period: 5s
      retries: 5
    restart: always

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: on-failure:5
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'L0cal-Dev-P@ssw0rd'
    networks:
      - ahwr-local
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'L0cal-Dev-P@ssw0rd' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    restart: on-failure
    volumes:
      - './compose/servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json'
    ports:
      - '5672:5672' # AMQP
      - '5300:5300' # Management API / health endpoint
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: 'L0cal-Dev-P@ssw0rd'
      ACCEPT_EULA: 'Y'
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - ahwr-local

  ahwr-payment-proxy:
    build:
      context: .
      target: development
    ports:
      - '3006:3001'
    links:
      - 'localstack:localstack'
      - 'mongodb:mongodb'
      - 'servicebus-emulator:servicebus-emulator'
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
    env_file:
      - path: 'compose/aws.env'
        required: true
      - path: './.env'
        required: false
    environment:
      PORT: 3001
      NODE_ENV: development
      AWS_ENDPOINT_URL: http://localstack:4566
      MONGO_URI: mongodb://mongodb:27017/
      USE_PRETTY_PRINT: true
      BACKOFFICE_UI_API_KEY: ${BACKOFFICE_UI_API_KEY:-446dcdbe-e02c-4d16-a266-001bbbd5f089}
      SERVICE_BUS_USE_EMULATOR: true
      MESSAGE_QUEUE_HOST: servicebus-emulator
      MESSAGE_QUEUE_USER: RootManageSharedAccessKey
      MESSAGE_QUEUE_PASSWORD: SAS_KEY_VALUE
      SEND_PAYMENT_REQUEST: true
    networks:
      - ahwr-local
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
      - ./scripts/wait-for-service-bus.cjs:/home/node/scripts/wait-for-service-bus.cjs
    command: sh -c "node scripts/wait-for-service-bus.cjs && npm run docker:dev"

################################################################################

volumes:
  mongodb-data:

networks:
  ahwr-local:
    external: true
    name: ahwr-local